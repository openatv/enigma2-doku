<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 580" role="img" aria-labelledby="title desc"><title id="title">Connect cable TV or an aerial directly</title><desc id="desc">Two alternative connections: cable outlet to DVB-C or aerial to DVB-T2.</desc><rect width="980" height="580" rx="16" fill="#f3f7fc"/><g font-family="Arial, Helvetica, sans-serif"><text x="30" y="33" font-size="14" fill="#1263c6" text-anchor="start" font-weight="700">OpenATV | RECEPTION</text><text x="30" y="68" font-size="26" fill="#14243b" text-anchor="start" font-weight="700">Connect cable TV or an aerial directly</text><rect x="35" y="125" width="230" height="96" rx="12" fill="#fff" stroke="#1263c6" stroke-width="2"/><text x="150.0" y="154" font-size="20" fill="#14243b" text-anchor="middle" font-weight="700">Cable TV outlet</text><text x="150.0" y="180" font-size="16" fill="#14243b" text-anchor="middle" font-weight="400">TV / CATV</text><path d="M152 294 v85 M112 306 h80 M120 326 h64 M129 346 h46" stroke="#127246" stroke-width="4"/><text x="152" y="405" font-size="18" fill="#14243b" text-anchor="middle" font-weight="400">DVB-T / T2</text><rect x="420" y="125" width="235" height="96" rx="12" fill="#fff" stroke="#1263c6" stroke-width="2"/><text x="537.5" y="154" font-size="20" fill="#14243b" text-anchor="middle" font-weight="700">OpenATV DVB-C</text><text x="537.5" y="180" font-size="16" fill="#14243b" text-anchor="middle" font-weight="400">CABLE / ANT IN</text><rect x="420" y="295" width="235" height="96" rx="12" fill="#fff" stroke="#1263c6" stroke-width="2"/><text x="537.5" y="324" font-size="20" fill="#14243b" text-anchor="middle" font-weight="700">OpenATV DVB-T2</text><text x="537.5" y="350" font-size="16" fill="#14243b" text-anchor="middle" font-weight="400">ANT / CABLE IN</text><polyline points="265,173 420,173" fill="none" stroke="#1263c6" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><text x="343" y="153" font-size="17" fill="#1263c6" text-anchor="middle" font-weight="400">IEC coax</text><polyline points="152,379 330,379 330,343 420,343" fill="none" stroke="#1263c6" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><rect x="765" y="210" width="155" height="96" rx="12" fill="#fff" stroke="#7c3ac2" stroke-width="2"/><text x="842.5" y="239" font-size="20" fill="#14243b" text-anchor="middle" font-weight="700">TV</text><text x="842.5" y="265" font-size="16" fill="#14243b" text-anchor="middle" font-weight="400">HDMI IN</text><polyline points="655,173 710,173 710,240 765,240" fill="none" stroke="#7c3ac2" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><polyline points="655,343 710,343 710,280 765,280" fill="none" stroke="#7c3ac2" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><text x="30" y="486" font-size="17" fill="#14243b" text-anchor="start" font-weight="400">Top and bottom are alternatives. Connector labels depend on the receiver.</text><text x="30" y="510" font-size="17" fill="#14243b" text-anchor="start" font-weight="400">Enable 5 V only for compatible active aerials; no aerial supply on a direct cable TV connection.</text><text x="30" y="560" font-size="14" fill="#69778a" text-anchor="start" font-weight="400">Blue: RF coaxial cable · Purple: HDMI · Dashed: inactive</text></g></svg>
