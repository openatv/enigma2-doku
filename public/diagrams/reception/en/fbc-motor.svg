<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 720" role="img" aria-labelledby="title desc"><title id="title">Fixed dish A and a separate motor dish B</title><desc id="desc">Fixed dish A and a separate motor dish B</desc><rect width="980" height="720" rx="16" fill="#f3f7fc"/><g font-family="Arial, Helvetica, sans-serif"><text x="30" y="32" font-size="14" fill="#1263c6" font-weight="700" text-anchor="start">OpenATV | FBC</text><text x="30" y="72" font-size="26" fill="#14243b" font-weight="700" text-anchor="start">Fixed dish A and a separate motor dish B</text><rect x="30" y="150" width="270" height="110" rx="12" fill="white" stroke="#1263c6" stroke-width="2"/><text x="165.0" y="180" font-size="20" fill="#14243b" font-weight="700" text-anchor="middle">Astra 19.2°E</text><text x="165.0" y="207" font-size="16" fill="#14243b" font-weight="400" text-anchor="middle">separate fixed dish</text><text x="165.0" y="230" font-size="16" fill="#14243b" font-weight="400" text-anchor="middle">Universal-LNB</text><rect x="30" y="355" width="270" height="120" rx="12" fill="white" stroke="#127246" stroke-width="2"/><text x="165.0" y="385" font-size="20" fill="#14243b" font-weight="700" text-anchor="middle">Separate motor dish</text><text x="165.0" y="412" font-size="16" fill="#14243b" font-weight="400" text-anchor="middle">LNB → Motor → REC</text><text x="165.0" y="435" font-size="16" fill="#14243b" font-weight="400" text-anchor="middle">selected position</text><polyline points="300,205 560,205" stroke="#1263c6" stroke-width="5" stroke-linejoin="round" fill="none"/><polyline points="300,415 560,415" stroke="#127246" stroke-width="5" stroke-linejoin="round" fill="none"/><text x="421" y="186" font-size="16" fill="#1263c6" font-weight="400" text-anchor="middle">independent feed 1</text><text x="421" y="396" font-size="16" fill="#127246" font-weight="400" text-anchor="middle">independent feed 2</text><rect x="550" y="128" width="390" height="405" rx="12" fill="white" stroke="#1263c6" stroke-width="2"/><text x="745.0" y="158" font-size="20" fill="#14243b" font-weight="700" text-anchor="middle">OpenATV FBC DVB-S</text><rect x="580" y="177" width="330" height="82" rx="12" fill="white" stroke="#1263c6" stroke-width="2"/><text x="745.0" y="207" font-size="20" fill="#14243b" font-weight="700" text-anchor="middle">SAT IN A · Root A</text><text x="745.0" y="234" font-size="16" fill="#14243b" font-weight="400" text-anchor="middle">Astra 19.2°E</text><rect x="580" y="372" width="330" height="82" rx="12" fill="white" stroke="#127246" stroke-width="2"/><text x="745.0" y="402" font-size="20" fill="#14243b" font-weight="700" text-anchor="middle">SAT IN B · Root B</text><text x="745.0" y="429" font-size="16" fill="#14243b" font-weight="400" text-anchor="middle">USALS / DiSEqC 1.2</text><text x="744" y="297" font-size="20" fill="#14243b" font-weight="700" text-anchor="middle">C–H: FBC automatic</text><text x="744" y="326" font-size="18" fill="#14243b" font-weight="400" text-anchor="middle">8 demodulators in total</text><text x="30" y="600" font-size="17" fill="#14243b" font-weight="400" text-anchor="start">A and B describe different signal sources: do not set B to “Equal to A”.</text><text x="30" y="628" font-size="17" fill="#14243b" font-weight="400" text-anchor="start">A motor dish can point at only ONE position; moving it affects everyone using that dish.</text><text x="30" y="656" font-size="17" fill="#14243b" font-weight="400" text-anchor="start">With universal LNBs, each feed remains limited to its currently selected satellite plane.</text><text x="30" y="697" font-size="14" fill="#69778a" font-weight="400" text-anchor="start">HF / RF: Blue = coax · Green/orange = second feed · Inside: schematic signal paths</text></g></svg>
