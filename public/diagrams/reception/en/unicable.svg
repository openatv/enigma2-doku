<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 620" role="img" aria-labelledby="title desc"><title id="title">Unicable: one cable, separate User Bands</title><desc id="desc">SCR output via suitable splitter to two independent tuners with different User Bands.</desc><rect width="980" height="620" rx="16" fill="#f3f7fc"/><g font-family="Arial, Helvetica, sans-serif"><text x="30" y="33" font-size="14" fill="#1263c6" text-anchor="start" font-weight="700">OpenATV | RECEPTION</text><text x="30" y="68" font-size="26" fill="#14243b" text-anchor="start" font-weight="700">Unicable: one cable, separate User Bands</text><rect x="30" y="190" width="250" height="106" rx="12" fill="#fff" stroke="#1263c6" stroke-width="2"/><text x="155.0" y="219" font-size="20" fill="#14243b" text-anchor="middle" font-weight="700">Unicable / SCR</text><text x="155.0" y="245" font-size="16" fill="#14243b" text-anchor="middle" font-weight="400">LNB or multiswitch</text><text x="155.0" y="267" font-size="16" fill="#14243b" text-anchor="middle" font-weight="400">SCR OUT</text><rect x="430" y="190" width="235" height="106" rx="12" fill="#fff" stroke="#1263c6" stroke-width="2"/><text x="547.5" y="219" font-size="20" fill="#14243b" text-anchor="middle" font-weight="700">SAT splitter</text><text x="547.5" y="245" font-size="16" fill="#14243b" text-anchor="middle" font-weight="400">DC-Pass per datasheet</text><text x="547.5" y="267" font-size="16" fill="#14243b" text-anchor="middle" font-weight="400">diode-isolated</text><polyline points="280,241 430,241" fill="none" stroke="#1263c6" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><text x="350" y="221" font-size="17" fill="#1263c6" text-anchor="middle" font-weight="400">SCR</text><rect x="730" y="110" width="215" height="110" rx="12" fill="#fff" stroke="#1263c6" stroke-width="2"/><text x="837.5" y="139" font-size="20" fill="#14243b" text-anchor="middle" font-weight="700">Tuner / receiver A</text><text x="837.5" y="165" font-size="16" fill="#14243b" text-anchor="middle" font-weight="400">SAT IN · UB 1</text><text x="837.5" y="187" font-size="16" fill="#14243b" text-anchor="middle" font-weight="400">1210 MHz *</text><rect x="730" y="315" width="215" height="110" rx="12" fill="#fff" stroke="#1263c6" stroke-width="2"/><text x="837.5" y="344" font-size="20" fill="#14243b" text-anchor="middle" font-weight="700">Tuner / receiver B</text><text x="837.5" y="370" font-size="16" fill="#14243b" text-anchor="middle" font-weight="400">SAT IN · UB 2</text><text x="837.5" y="392" font-size="16" fill="#14243b" text-anchor="middle" font-weight="400">1420 MHz *</text><polyline points="665,220 700,220 700,165 730,165" fill="none" stroke="#1263c6" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><polyline points="665,265 700,265 700,370 730,370" fill="none" stroke="#1263c6" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><text x="30" y="526" font-size="17" fill="#14243b" text-anchor="start" font-weight="400">* Example values only! Use the UB number and frequency assigned for your installation.</text><text x="30" y="550" font-size="17" fill="#14243b" text-anchor="start" font-weight="400">Each independent tuner needs its own UB. Do not use a plain Y lead for legacy satellite.</text><text x="30" y="600" font-size="14" fill="#69778a" text-anchor="start" font-weight="400">Blue: RF coaxial cable · Purple: HDMI · Dashed: inactive</text></g></svg>
