<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 720" role="img" aria-labelledby="title desc"><title id="title">Unicable: one cable for eight independent tuners</title><desc id="desc">SCR feed into A; A through H use different user bands.</desc><rect width="980" height="720" rx="16" fill="#f3f7fc"/><g font-family="Arial, Helvetica, sans-serif"><text x="30" y="32" font-size="14" fill="#1263c6" font-weight="700" text-anchor="start">OpenATV | FBC</text><text x="30" y="72" font-size="26" fill="#14243b" font-weight="700" text-anchor="start">Unicable: one cable for eight independent tuners</text><rect x="30" y="160" width="280" height="126" rx="12" fill="white" stroke="#1263c6" stroke-width="2"/><text x="170.0" y="190" font-size="20" fill="#14243b" font-weight="700" text-anchor="middle">Unicable / SCR / JESS</text><text x="170.0" y="217" font-size="16" fill="#14243b" font-weight="400" text-anchor="middle">LNB or multiswitch</text><text x="170.0" y="240" font-size="16" fill="#14243b" font-weight="400" text-anchor="middle">8 exclusively assigned UBs</text><polyline points="310,221 410,221" stroke="#1263c6" stroke-width="5" stroke-linejoin="round" fill="none"/><text x="360" y="200" font-size="16" fill="#1263c6" font-weight="400" text-anchor="middle">1 cable</text><rect x="410" y="135" width="530" height="415" rx="12" fill="white" stroke="#1263c6" stroke-width="2"/><text x="675.0" y="165" font-size="20" fill="#14243b" font-weight="700" text-anchor="middle">OpenATV FBC DVB-S</text><rect x="428" y="186" width="190" height="80" rx="12" fill="white" stroke="#1263c6" stroke-width="2"/><text x="523.0" y="216" font-size="20" fill="#14243b" font-weight="700" text-anchor="middle">SAT IN A</text><text x="523.0" y="243" font-size="16" fill="#14243b" font-weight="400" text-anchor="middle">Coax connected</text><rect x="428" y="297" width="190" height="80" rx="12" fill="white" stroke="#69778a" stroke-width="2"/><text x="523.0" y="327" font-size="20" fill="#14243b" font-weight="700" text-anchor="middle">SAT IN B</text><text x="523.0" y="354" font-size="16" fill="#14243b" font-weight="400" text-anchor="middle">Socket remains free</text><rect x="684" y="184" width="106" height="56" rx="8" fill="#fff" stroke="#1263c6" stroke-width="2"/><text x="737" y="207" font-size="20" fill="#1263c6" font-weight="700" text-anchor="middle">A</text><text x="737" y="228" font-size="14" fill="#14243b" font-weight="400" text-anchor="middle">UB 1</text><rect x="800" y="184" width="106" height="56" rx="8" fill="#fff" stroke="#1263c6" stroke-width="2"/><text x="853" y="207" font-size="20" fill="#1263c6" font-weight="700" text-anchor="middle">B</text><text x="853" y="228" font-size="14" fill="#14243b" font-weight="400" text-anchor="middle">UB 2</text><rect x="684" y="252" width="106" height="56" rx="8" fill="#fff" stroke="#1263c6" stroke-width="2"/><text x="737" y="275" font-size="20" fill="#1263c6" font-weight="700" text-anchor="middle">C</text><text x="737" y="296" font-size="14" fill="#14243b" font-weight="400" text-anchor="middle">UB 3</text><rect x="800" y="252" width="106" height="56" rx="8" fill="#fff" stroke="#1263c6" stroke-width="2"/><text x="853" y="275" font-size="20" fill="#1263c6" font-weight="700" text-anchor="middle">D</text><text x="853" y="296" font-size="14" fill="#14243b" font-weight="400" text-anchor="middle">UB 4</text><rect x="684" y="320" width="106" height="56" rx="8" fill="#fff" stroke="#1263c6" stroke-width="2"/><text x="737" y="343" font-size="20" fill="#1263c6" font-weight="700" text-anchor="middle">E</text><text x="737" y="364" font-size="14" fill="#14243b" font-weight="400" text-anchor="middle">UB 5</text><rect x="800" y="320" width="106" height="56" rx="8" fill="#fff" stroke="#1263c6" stroke-width="2"/><text x="853" y="343" font-size="20" fill="#1263c6" font-weight="700" text-anchor="middle">F</text><text x="853" y="364" font-size="14" fill="#14243b" font-weight="400" text-anchor="middle">UB 6</text><rect x="684" y="388" width="106" height="56" rx="8" fill="#fff" stroke="#1263c6" stroke-width="2"/><text x="737" y="411" font-size="20" fill="#1263c6" font-weight="700" text-anchor="middle">G</text><text x="737" y="432" font-size="14" fill="#14243b" font-weight="400" text-anchor="middle">UB 7</text><rect x="800" y="388" width="106" height="56" rx="8" fill="#fff" stroke="#1263c6" stroke-width="2"/><text x="853" y="411" font-size="20" fill="#1263c6" font-weight="700" text-anchor="middle">H</text><text x="853" y="432" font-size="14" fill="#14243b" font-weight="400" text-anchor="middle">UB 8</text><text x="677" y="497" font-size="18" fill="#14243b" font-weight="700" text-anchor="middle">B–H internally connected to A</text><text x="170" y="369" font-size="19" fill="#14243b" font-weight="400" text-anchor="middle">Each UB carries</text><text x="170" y="399" font-size="19" fill="#14243b" font-weight="400" text-anchor="middle">one selected</text><text x="170" y="429" font-size="19" fill="#14243b" font-weight="400" text-anchor="middle">transponder.</text><text x="30" y="600" font-size="17" fill="#14243b" font-weight="400" text-anchor="start">Give A–H a unique user band and matching frequency. All share the same SCR connection.</text><text x="30" y="628" font-size="17" fill="#14243b" font-weight="400" text-anchor="start">Logical tuner B remains usable even though the second input socket has no cable.</text><text x="30" y="656" font-size="17" fill="#14243b" font-weight="400" text-anchor="start">UB 1–8 are an example assignment. Other receivers on the same branch must not reuse them.</text><text x="30" y="697" font-size="14" fill="#69778a" font-weight="400" text-anchor="start">HF / RF: Blue = coax · Green/orange = second feed · Inside: schematic signal paths</text></g></svg>
