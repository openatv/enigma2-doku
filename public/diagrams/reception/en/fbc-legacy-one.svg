<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 720" role="img" aria-labelledby="title desc"><title id="title">Universal LNB: one cable</title><desc id="desc">Universal LNB: one cable</desc><rect width="980" height="720" rx="16" fill="#f3f7fc"/><g font-family="Arial, Helvetica, sans-serif"><text x="30" y="32" font-size="14" fill="#1263c6" font-weight="700" text-anchor="start">OpenATV | FBC</text><text x="30" y="72" font-size="26" fill="#14243b" font-weight="700" text-anchor="start">Universal LNB: one cable</text><rect x="30" y="135" width="265" height="120" rx="12" fill="white" stroke="#1263c6" stroke-width="2"/><text x="162.5" y="165" font-size="20" fill="#14243b" font-weight="700" text-anchor="middle">Universal-LNB</text><text x="162.5" y="192" font-size="16" fill="#14243b" font-weight="400" text-anchor="middle">4 available SAT planes</text><text x="162.5" y="215" font-size="16" fill="#14243b" font-weight="400" text-anchor="middle">VL · HL · VH · HH</text><rect x="30" y="300" width="265" height="112" rx="12" fill="white" stroke="#1263c6" stroke-width="2"/><text x="162.5" y="330" font-size="20" fill="#14243b" font-weight="700" text-anchor="middle">Output 1: e.g. HL</text><text x="162.5" y="357" font-size="16" fill="#14243b" font-weight="400" text-anchor="middle">18 V · 0 kHz</text><text x="162.5" y="380" font-size="16" fill="#14243b" font-weight="400" text-anchor="middle">one selected plane</text><polyline points="295,348 345,348 345,208 410,208" stroke="#1263c6" stroke-width="5" stroke-linejoin="round" fill="none"/><rect x="410" y="140" width="530" height="410" rx="12" fill="white" stroke="#1263c6" stroke-width="2"/><text x="675.0" y="170" font-size="20" fill="#14243b" font-weight="700" text-anchor="middle">OpenATV FBC DVB-S</text><rect x="428" y="183" width="190" height="74" rx="12" fill="white" stroke="#1263c6" stroke-width="2"/><text x="523.0" y="213" font-size="20" fill="#14243b" font-weight="700" text-anchor="middle">SAT IN A</text><text x="523.0" y="240" font-size="16" fill="#14243b" font-weight="400" text-anchor="middle">Root A · HL</text><rect x="428" y="273" width="190" height="74" rx="12" fill="white" stroke="#69778a" stroke-width="2"/><text x="523.0" y="303" font-size="20" fill="#14243b" font-weight="700" text-anchor="middle">SAT IN B</text><text x="523.0" y="330" font-size="16" fill="#14243b" font-weight="400" text-anchor="middle">internally from A · HL</text><text x="526" y="388" font-size="17" fill="#14243b" font-weight="400" text-anchor="middle">Internal routing</text><text x="526" y="414" font-size="18" fill="#14243b" font-weight="700" text-anchor="middle">C–H: automatic</text><rect x="684" y="188" width="106" height="56" rx="8" fill="#fff" stroke="#1263c6" stroke-width="2"/><text x="737" y="211" font-size="20" fill="#1263c6" font-weight="700" text-anchor="middle">A</text><text x="737" y="232" font-size="14" fill="#14243b" font-weight="400" text-anchor="middle">HL</text><rect x="800" y="188" width="106" height="56" rx="8" fill="#fff" stroke="#1263c6" stroke-width="2"/><text x="853" y="211" font-size="20" fill="#1263c6" font-weight="700" text-anchor="middle">B</text><text x="853" y="232" font-size="14" fill="#14243b" font-weight="400" text-anchor="middle">HL</text><rect x="684" y="256" width="106" height="56" rx="8" fill="#fff" stroke="#1263c6" stroke-width="2"/><text x="737" y="279" font-size="20" fill="#1263c6" font-weight="700" text-anchor="middle">C</text><text x="737" y="300" font-size="14" fill="#14243b" font-weight="400" text-anchor="middle">HL</text><rect x="800" y="256" width="106" height="56" rx="8" fill="#fff" stroke="#1263c6" stroke-width="2"/><text x="853" y="279" font-size="20" fill="#1263c6" font-weight="700" text-anchor="middle">D</text><text x="853" y="300" font-size="14" fill="#14243b" font-weight="400" text-anchor="middle">HL</text><rect x="684" y="324" width="106" height="56" rx="8" fill="#fff" stroke="#1263c6" stroke-width="2"/><text x="737" y="347" font-size="20" fill="#1263c6" font-weight="700" text-anchor="middle">E</text><text x="737" y="368" font-size="14" fill="#14243b" font-weight="400" text-anchor="middle">HL</text><rect x="800" y="324" width="106" height="56" rx="8" fill="#fff" stroke="#1263c6" stroke-width="2"/><text x="853" y="347" font-size="20" fill="#1263c6" font-weight="700" text-anchor="middle">F</text><text x="853" y="368" font-size="14" fill="#14243b" font-weight="400" text-anchor="middle">HL</text><rect x="684" y="392" width="106" height="56" rx="8" fill="#fff" stroke="#1263c6" stroke-width="2"/><text x="737" y="415" font-size="20" fill="#1263c6" font-weight="700" text-anchor="middle">G</text><text x="737" y="436" font-size="14" fill="#14243b" font-weight="400" text-anchor="middle">HL</text><rect x="800" y="392" width="106" height="56" rx="8" fill="#fff" stroke="#1263c6" stroke-width="2"/><text x="853" y="415" font-size="20" fill="#1263c6" font-weight="700" text-anchor="middle">H</text><text x="853" y="436" font-size="14" fill="#14243b" font-weight="400" text-anchor="middle">HL</text><text x="675" y="514" font-size="18" fill="#14243b" font-weight="400" text-anchor="middle">2 inputs · 8 demodulators</text><text x="30" y="600" font-size="17" fill="#14243b" font-weight="400" text-anchor="start">Up to 8 transponders from ONE plane. Other planes are unavailable at the same time.</text><text x="30" y="628" font-size="17" fill="#14243b" font-weight="400" text-anchor="start">C–H are assigned to the inputs as needed; there is no fixed 4 + 4 split.</text><text x="30" y="656" font-size="17" fill="#14243b" font-weight="400" text-anchor="start">The planes shown are examples. Two cables require two independent subscriber outputs.</text><text x="30" y="697" font-size="14" fill="#69778a" font-weight="400" text-anchor="start">HF / RF: Blue = coax · Green/orange = second feed · Inside: schematic signal paths</text></g></svg>
