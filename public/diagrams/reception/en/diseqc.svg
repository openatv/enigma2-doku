<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 580" role="img" aria-labelledby="title desc"><title id="title">Two positions through a DiSEqC switch</title><desc id="desc">Astra on input A and Hotbird on B; output to receiver. Example port assignment.</desc><rect width="980" height="580" rx="16" fill="#f3f7fc"/><g font-family="Arial, Helvetica, sans-serif"><text x="30" y="33" font-size="14" fill="#1263c6" text-anchor="start" font-weight="700">OpenATV | RECEPTION</text><text x="30" y="68" font-size="26" fill="#14243b" text-anchor="start" font-weight="700">Two positions through a DiSEqC switch</text><path d="M84 112 Q86 188 162 184 Z" fill="#dbe9fb" stroke="#1263c6" stroke-width="3"/><path d="M120 166 L154 126 M120 170 v35 h-25 h50" fill="none" stroke="#1263c6" stroke-width="4"/><circle cx="154" cy="126" r="6" fill="#1263c6"/><text x="120" y="234" font-size="18" fill="#14243b" text-anchor="middle" font-weight="400">Astra 19.2°E</text><path d="M84 282 Q86 358 162 354 Z" fill="#dbe9fb" stroke="#1263c6" stroke-width="3"/><path d="M120 336 L154 296 M120 340 v35 h-25 h50" fill="none" stroke="#1263c6" stroke-width="4"/><circle cx="154" cy="296" r="6" fill="#1263c6"/><text x="120" y="404" font-size="18" fill="#14243b" text-anchor="middle" font-weight="400">Hotbird 13.0°E</text><rect x="330" y="195" width="270" height="113" rx="12" fill="#fff" stroke="#1263c6" stroke-width="2"/><text x="465.0" y="224" font-size="20" fill="#14243b" text-anchor="middle" font-weight="700">DiSEqC 2/1</text><text x="465.0" y="250" font-size="16" fill="#14243b" text-anchor="middle" font-weight="400">A / 1               B / 2</text><text x="465.0" y="272" font-size="16" fill="#14243b" text-anchor="middle" font-weight="400">OUT → Receiver</text><polyline points="154,126 278,126 278,227 330,227" fill="none" stroke="#1263c6" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><text x="256" y="111" font-size="17" fill="#1263c6" text-anchor="middle" font-weight="400">A / 1</text><polyline points="154,296 267,296 267,277 330,277" fill="none" stroke="#1263c6" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><text x="252" y="323" font-size="17" fill="#1263c6" text-anchor="middle" font-weight="400">B / 2</text><rect x="730" y="208" width="195" height="96" rx="12" fill="#fff" stroke="#1263c6" stroke-width="2"/><text x="827.5" y="237" font-size="20" fill="#14243b" text-anchor="middle" font-weight="700">OpenATV</text><text x="827.5" y="263" font-size="16" fill="#14243b" text-anchor="middle" font-weight="400">SAT IN</text><polyline points="600,252 730,252" fill="none" stroke="#1263c6" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><text x="665" y="232" font-size="17" fill="#1263c6" text-anchor="middle" font-weight="400">one coax cable</text><text x="30" y="486" font-size="17" fill="#14243b" text-anchor="start" font-weight="400">Receiver: Simple → DiSEqC A/B; port A = Astra, port B = Hotbird (example).</text><text x="30" y="510" font-size="17" fill="#14243b" text-anchor="start" font-weight="400">Follow the actual switch port numbers. A monoblock may have a different assignment.</text><text x="30" y="560" font-size="14" fill="#69778a" text-anchor="start" font-weight="400">Blue: RF coaxial cable · Purple: HDMI · Dashed: inactive</text></g></svg>
