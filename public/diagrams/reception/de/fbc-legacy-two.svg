<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 720" role="img" aria-labelledby="title desc"><title id="title">Universal-LNB: zwei unabhängige Kabel</title><desc id="desc">Universal-LNB: zwei unabhängige Kabel</desc><rect width="980" height="720" rx="16" fill="#f3f7fc"/><g font-family="Arial, Helvetica, sans-serif"><text x="30" y="32" font-size="14" fill="#1263c6" font-weight="700" text-anchor="start">OpenATV | FBC</text><text x="30" y="72" font-size="26" fill="#14243b" font-weight="700" text-anchor="start">Universal-LNB: zwei unabhängige Kabel</text><rect x="30" y="135" width="265" height="120" rx="12" fill="white" stroke="#1263c6" stroke-width="2"/><text x="162.5" y="165" font-size="20" fill="#14243b" font-weight="700" text-anchor="middle">Twin / Quad / Multischalter</text><text x="162.5" y="192" font-size="16" fill="#14243b" font-weight="400" text-anchor="middle">4 mögliche SAT-Ebenen</text><text x="162.5" y="215" font-size="16" fill="#14243b" font-weight="400" text-anchor="middle">VL · HL · VH · HH</text><rect x="30" y="300" width="265" height="112" rx="12" fill="white" stroke="#1263c6" stroke-width="2"/><text x="162.5" y="330" font-size="20" fill="#14243b" font-weight="700" text-anchor="middle">Ausgang 1: z. B. HL</text><text x="162.5" y="357" font-size="16" fill="#14243b" font-weight="400" text-anchor="middle">18 V · 0 kHz</text><text x="162.5" y="380" font-size="16" fill="#14243b" font-weight="400" text-anchor="middle">eine gewählte Ebene</text><rect x="30" y="450" width="265" height="112" rx="12" fill="white" stroke="#127246" stroke-width="2"/><text x="162.5" y="480" font-size="20" fill="#14243b" font-weight="700" text-anchor="middle">Ausgang 2: z. B. VH</text><text x="162.5" y="507" font-size="16" fill="#14243b" font-weight="400" text-anchor="middle">13 V · 22 kHz</text><text x="162.5" y="530" font-size="16" fill="#14243b" font-weight="400" text-anchor="middle">unabhängig gewählt</text><polyline points="295,348 345,348 345,208 410,208" stroke="#1263c6" stroke-width="5" stroke-linejoin="round" fill="none"/><polyline points="295,498 365,498 365,296 410,296" stroke="#127246" stroke-width="5" stroke-linejoin="round" fill="none"/><rect x="410" y="140" width="530" height="410" rx="12" fill="white" stroke="#1263c6" stroke-width="2"/><text x="675.0" y="170" font-size="20" fill="#14243b" font-weight="700" text-anchor="middle">OpenATV FBC DVB-S</text><rect x="428" y="183" width="190" height="74" rx="12" fill="white" stroke="#1263c6" stroke-width="2"/><text x="523.0" y="213" font-size="20" fill="#14243b" font-weight="700" text-anchor="middle">SAT IN A</text><text x="523.0" y="240" font-size="16" fill="#14243b" font-weight="400" text-anchor="middle">Root A · HL</text><rect x="428" y="273" width="190" height="74" rx="12" fill="white" stroke="#127246" stroke-width="2"/><text x="523.0" y="303" font-size="20" fill="#14243b" font-weight="700" text-anchor="middle">SAT IN B</text><text x="523.0" y="330" font-size="16" fill="#14243b" font-weight="400" text-anchor="middle">Root B · VH</text><text x="526" y="388" font-size="17" fill="#14243b" font-weight="400" text-anchor="middle">Interne Verteilung</text><text x="526" y="414" font-size="18" fill="#14243b" font-weight="700" text-anchor="middle">C–H: automatisch</text><rect x="684" y="188" width="106" height="56" rx="8" fill="#fff" stroke="#1263c6" stroke-width="2"/><text x="737" y="211" font-size="20" fill="#1263c6" font-weight="700" text-anchor="middle">A</text><text x="737" y="232" font-size="14" fill="#14243b" font-weight="400" text-anchor="middle">HL</text><rect x="800" y="188" width="106" height="56" rx="8" fill="#fff" stroke="#1263c6" stroke-width="2"/><text x="853" y="211" font-size="20" fill="#1263c6" font-weight="700" text-anchor="middle">B</text><text x="853" y="232" font-size="14" fill="#14243b" font-weight="400" text-anchor="middle">VH</text><rect x="684" y="256" width="106" height="56" rx="8" fill="#fff" stroke="#1263c6" stroke-width="2"/><text x="737" y="279" font-size="20" fill="#1263c6" font-weight="700" text-anchor="middle">C</text><text x="737" y="300" font-size="14" fill="#14243b" font-weight="400" text-anchor="middle">HL / VH</text><rect x="800" y="256" width="106" height="56" rx="8" fill="#fff" stroke="#1263c6" stroke-width="2"/><text x="853" y="279" font-size="20" fill="#1263c6" font-weight="700" text-anchor="middle">D</text><text x="853" y="300" font-size="14" fill="#14243b" font-weight="400" text-anchor="middle">HL / VH</text><rect x="684" y="324" width="106" height="56" rx="8" fill="#fff" stroke="#1263c6" stroke-width="2"/><text x="737" y="347" font-size="20" fill="#1263c6" font-weight="700" text-anchor="middle">E</text><text x="737" y="368" font-size="14" fill="#14243b" font-weight="400" text-anchor="middle">HL / VH</text><rect x="800" y="324" width="106" height="56" rx="8" fill="#fff" stroke="#1263c6" stroke-width="2"/><text x="853" y="347" font-size="20" fill="#1263c6" font-weight="700" text-anchor="middle">F</text><text x="853" y="368" font-size="14" fill="#14243b" font-weight="400" text-anchor="middle">HL / VH</text><rect x="684" y="392" width="106" height="56" rx="8" fill="#fff" stroke="#1263c6" stroke-width="2"/><text x="737" y="415" font-size="20" fill="#1263c6" font-weight="700" text-anchor="middle">G</text><text x="737" y="436" font-size="14" fill="#14243b" font-weight="400" text-anchor="middle">HL / VH</text><rect x="800" y="392" width="106" height="56" rx="8" fill="#fff" stroke="#1263c6" stroke-width="2"/><text x="853" y="415" font-size="20" fill="#1263c6" font-weight="700" text-anchor="middle">H</text><text x="853" y="436" font-size="14" fill="#14243b" font-weight="400" text-anchor="middle">HL / VH</text><text x="675" y="514" font-size="18" fill="#14243b" font-weight="400" text-anchor="middle">2 Eingänge · 8 Demodulatoren</text><text x="30" y="600" font-size="17" fill="#14243b" font-weight="400" text-anchor="start">Bis zu 8 Transponder aus den 2 gerade gewählten Ebenen; insgesamt weiterhin 8 Demodulatoren.</text><text x="30" y="628" font-size="17" fill="#14243b" font-weight="400" text-anchor="start">C–H werden nach Bedarf den Eingängen zugeordnet; keine starre Aufteilung 4 + 4.</text><text x="30" y="656" font-size="17" fill="#14243b" font-weight="400" text-anchor="start">Die Ebenen sind Beispiele. Zwei Kabel benötigen zwei unabhängige Teilnehmerausgänge.</text><text x="30" y="697" font-size="14" fill="#69778a" font-weight="400" text-anchor="start">HF / RF: Blau = Koax · Grün/Orange = zweite Zuführung · Innen: schematische Signalwege</text></g></svg>
