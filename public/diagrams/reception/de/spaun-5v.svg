<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 580" role="img" aria-labelledby="title desc"><title id="title">SPAUN: Antenne mit 5 V auswählen</title><desc id="desc">TAR 5 verbindet bei 5 V die Antenne, bei 0 V CATV mit dem gemeinsamen Hybrid-Eingang. Bei nicht DC-tauglicher Antenne liegt ein DC-Blocker im Antennenzweig.</desc><rect width="980" height="580" rx="16" fill="#f3f7fc"/><g font-family="Arial, Helvetica, sans-serif"><text x="30" y="33" font-size="14" fill="#1263c6" text-anchor="start" font-weight="700">OpenATV | EMPFANG</text><text x="30" y="68" font-size="26" fill="#14243b" text-anchor="start" font-weight="700">SPAUN: Antenne mit 5 V auswählen</text><path d="M126 101 v85 M86 113 h80 M94 133 h64 M103 153 h46" stroke="#127246" stroke-width="4"/><text x="126" y="212" font-size="18" fill="#14243b" text-anchor="middle" font-weight="400">DVB-T / T2</text><rect x="27" y="309" width="210" height="96" rx="12" fill="#fff" stroke="#1263c6" stroke-width="2"/><text x="132.0" y="338" font-size="20" fill="#14243b" text-anchor="middle" font-weight="700">CATV</text><text x="132.0" y="364" font-size="16" fill="#14243b" text-anchor="middle" font-weight="400">TV aus Kabeldose</text><rect x="425" y="174" width="220" height="155" rx="12" fill="#fff" stroke="#1263c6" stroke-width="2"/><text x="535.0" y="203" font-size="20" fill="#14243b" text-anchor="middle" font-weight="700">SPAUN TAR 5</text><text x="438" y="229" font-size="16" fill="#14243b" text-anchor="start" font-weight="400">DVB-T IN</text><text x="438" y="279" font-size="16" fill="#14243b" text-anchor="start" font-weight="400">CATV IN</text><text x="614" y="245" font-size="15" fill="#14243b" text-anchor="middle" font-weight="400">OUT</text><polyline points="126,187 218,187" fill="none" stroke="#1263c6" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><rect x="218" y="163" width="166" height="48" rx="12" fill="#fff" stroke="#1263c6" stroke-width="2"/><text x="301.0" y="192" font-size="20" fill="#14243b" text-anchor="middle" font-weight="700">DC-Blocker *</text><polyline points="384,187 407,187 407,223 425,223" fill="none" stroke="#1263c6" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><polyline points="237,357 338,357 338,273 425,273" fill="none" stroke="#69778a" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="10 8"/><rect x="755" y="202" width="195" height="109" rx="12" fill="#fff" stroke="#1263c6" stroke-width="2"/><text x="852.5" y="231" font-size="20" fill="#14243b" text-anchor="middle" font-weight="700">OpenATV</text><text x="852.5" y="257" font-size="16" fill="#14243b" text-anchor="middle" font-weight="400">DVB-C / T2</text><text x="852.5" y="279" font-size="16" fill="#14243b" text-anchor="middle" font-weight="400">Hybrid-Tuner</text><polyline points="645,253 755,253" fill="none" stroke="#1263c6" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><text x="700" y="232" font-size="20" fill="#127246" text-anchor="middle" font-weight="700">5 V ←</text><text x="535" y="359" font-size="22" fill="#14243b" text-anchor="middle" font-weight="700">Jetzt: DVB-T / T2</text><text x="30" y="441" font-size="17" fill="#14243b" text-anchor="start" font-weight="400">* Für Antennen ohne DC-Verträglichkeit. Bei 5-V-Aktivantennen entfällt der Blocker.</text><text x="30" y="486" font-size="17" fill="#14243b" text-anchor="start" font-weight="400">Box: DVB-C und DVB-T2 konfigurieren; 5-V-Option im DVB-T-Zweig einschalten.</text><text x="30" y="510" font-size="17" fill="#14243b" text-anchor="start" font-weight="400">Ein gemeinsamer Tuner empfängt C oder T2 abwechselnd. Keine gleichzeitigen C/T2-Aufnahmen.</text><text x="30" y="560" font-size="14" fill="#69778a" text-anchor="start" font-weight="400">Blau: HF-Koaxialkabel · Violett: HDMI · Gestrichelt: inaktiv</text></g></svg>
