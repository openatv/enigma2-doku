<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 720" role="img" aria-labelledby="title desc"><title id="title">Feste Antenne A und eigene Motorantenne B</title><desc id="desc">Feste Antenne A und eigene Motorantenne B</desc><rect width="980" height="720" rx="16" fill="#f3f7fc"/><g font-family="Arial, Helvetica, sans-serif"><text x="30" y="32" font-size="14" fill="#1263c6" font-weight="700" text-anchor="start">OpenATV | FBC</text><text x="30" y="72" font-size="26" fill="#14243b" font-weight="700" text-anchor="start">Feste Antenne A und eigene Motorantenne B</text><rect x="30" y="150" width="270" height="110" rx="12" fill="white" stroke="#1263c6" stroke-width="2"/><text x="165.0" y="180" font-size="20" fill="#14243b" font-weight="700" text-anchor="middle">Astra 19.2°E</text><text x="165.0" y="207" font-size="16" fill="#14243b" font-weight="400" text-anchor="middle">eigene feste Antenne</text><text x="165.0" y="230" font-size="16" fill="#14243b" font-weight="400" text-anchor="middle">Universal-LNB</text><rect x="30" y="355" width="270" height="120" rx="12" fill="white" stroke="#127246" stroke-width="2"/><text x="165.0" y="385" font-size="20" fill="#14243b" font-weight="700" text-anchor="middle">Eigene Motorantenne</text><text x="165.0" y="412" font-size="16" fill="#14243b" font-weight="400" text-anchor="middle">LNB → Motor → REC</text><text x="165.0" y="435" font-size="16" fill="#14243b" font-weight="400" text-anchor="middle">gewählte Position</text><polyline points="300,205 560,205" stroke="#1263c6" stroke-width="5" stroke-linejoin="round" fill="none"/><polyline points="300,415 560,415" stroke="#127246" stroke-width="5" stroke-linejoin="round" fill="none"/><text x="421" y="186" font-size="16" fill="#1263c6" font-weight="400" text-anchor="middle">unabhängige Leitung 1</text><text x="421" y="396" font-size="16" fill="#127246" font-weight="400" text-anchor="middle">unabhängige Leitung 2</text><rect x="550" y="128" width="390" height="405" rx="12" fill="white" stroke="#1263c6" stroke-width="2"/><text x="745.0" y="158" font-size="20" fill="#14243b" font-weight="700" text-anchor="middle">OpenATV FBC DVB-S</text><rect x="580" y="177" width="330" height="82" rx="12" fill="white" stroke="#1263c6" stroke-width="2"/><text x="745.0" y="207" font-size="20" fill="#14243b" font-weight="700" text-anchor="middle">SAT IN A · Root A</text><text x="745.0" y="234" font-size="16" fill="#14243b" font-weight="400" text-anchor="middle">Astra 19.2°E</text><rect x="580" y="372" width="330" height="82" rx="12" fill="white" stroke="#127246" stroke-width="2"/><text x="745.0" y="402" font-size="20" fill="#14243b" font-weight="700" text-anchor="middle">SAT IN B · Root B</text><text x="745.0" y="429" font-size="16" fill="#14243b" font-weight="400" text-anchor="middle">USALS / DiSEqC 1.2</text><text x="744" y="297" font-size="20" fill="#14243b" font-weight="700" text-anchor="middle">C–H: FBC automatisch</text><text x="744" y="326" font-size="18" fill="#14243b" font-weight="400" text-anchor="middle">8 Demodulatoren insgesamt</text><text x="30" y="600" font-size="17" fill="#14243b" font-weight="400" text-anchor="start">A und B beschreiben unterschiedliche Signalquellen: B daher nicht „Gleich wie A“.</text><text x="30" y="628" font-size="17" fill="#14243b" font-weight="400" text-anchor="start">Eine Motorantenne steht immer nur auf EINER Position; eine Bewegung betrifft alle Nutzer davon.</text><text x="30" y="656" font-size="17" fill="#14243b" font-weight="400" text-anchor="start">Bei Universal-LNBs bleiben je Leitung die Grenzen der gerade gewählten SAT-Ebene bestehen.</text><text x="30" y="697" font-size="14" fill="#69778a" font-weight="400" text-anchor="start">HF / RF: Blau = Koax · Grün/Orange = zweite Zuführung · Innen: schematische Signalwege</text></g></svg>
