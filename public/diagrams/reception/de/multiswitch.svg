<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 580" role="img" aria-labelledby="title desc"><title id="title">Mehrere unabhängige Anschlüsse im Haus</title><desc id="desc">Quattro-LNB mit vier getrennten Ebenen an passende Multischalter-Eingänge, je Teilnehmer ein Kabel.</desc><rect width="980" height="580" rx="16" fill="#f3f7fc"/><g font-family="Arial, Helvetica, sans-serif"><text x="30" y="33" font-size="14" fill="#1263c6" text-anchor="start" font-weight="700">OpenATV | EMPFANG</text><text x="30" y="68" font-size="26" fill="#14243b" text-anchor="start" font-weight="700">Mehrere unabhängige Anschlüsse im Haus</text><rect x="30" y="160" width="245" height="100" rx="12" fill="#fff" stroke="#1263c6" stroke-width="2"/><text x="152.5" y="189" font-size="20" fill="#14243b" text-anchor="middle" font-weight="700">Quattro-LNB</text><text x="152.5" y="215" font-size="16" fill="#14243b" text-anchor="middle" font-weight="400">VL     HL     VH     HH</text><text x="152.5" y="237" font-size="16" fill="#14243b" text-anchor="middle" font-weight="400">4 × OUT</text><rect x="445" y="160" width="235" height="100" rx="12" fill="#fff" stroke="#1263c6" stroke-width="2"/><text x="562.5" y="189" font-size="20" fill="#14243b" text-anchor="middle" font-weight="700">Multischalter</text><text x="562.5" y="215" font-size="16" fill="#14243b" text-anchor="middle" font-weight="400">VL     HL     VH     HH</text><text x="562.5" y="237" font-size="16" fill="#14243b" text-anchor="middle" font-weight="400">Teilnehmer-Ausgänge</text><polyline points="275,177 445,177" fill="none" stroke="#1263c6" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><polyline points="275,200 445,200" fill="none" stroke="#127246" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><polyline points="275,223 445,223" fill="none" stroke="#7c3ac2" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><polyline points="275,246 445,246" fill="none" stroke="#b66b00" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><text x="360" y="139" font-size="17" fill="#14243b" text-anchor="middle" font-weight="400">4 feste Ebenen</text><rect x="740" y="110" width="205" height="96" rx="12" fill="#fff" stroke="#1263c6" stroke-width="2"/><text x="842.5" y="139" font-size="20" fill="#14243b" text-anchor="middle" font-weight="700">OpenATV A</text><text x="842.5" y="165" font-size="16" fill="#14243b" text-anchor="middle" font-weight="400">SAT IN</text><rect x="740" y="303" width="205" height="96" rx="12" fill="#fff" stroke="#1263c6" stroke-width="2"/><text x="842.5" y="332" font-size="20" fill="#14243b" text-anchor="middle" font-weight="700">OpenATV B</text><text x="842.5" y="358" font-size="16" fill="#14243b" text-anchor="middle" font-weight="400">SAT IN</text><polyline points="680,185 710,185 710,158 740,158" fill="none" stroke="#1263c6" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><polyline points="680,240 710,240 710,351 740,351" fill="none" stroke="#1263c6" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><text x="30" y="486" font-size="17" fill="#14243b" text-anchor="start" font-weight="400">VL/HL/VH/HH müssen zum beschrifteten Eingang passen; die Reihenfolge hier ist schematisch.</text><text x="30" y="510" font-size="17" fill="#14243b" text-anchor="start" font-weight="400">Ein Quad-LNB ist anders: Seine Teilnehmer-Ausgänge liefern jeweils eine gewählte Ebene.</text><text x="30" y="560" font-size="14" fill="#69778a" text-anchor="start" font-weight="400">Vier Farben links: getrennte SAT-Ebenen · Blau rechts: Teilnehmerleitungen</text></g></svg>
