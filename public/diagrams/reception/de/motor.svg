le" font-weight="700">OpenATV</text><text x="848.5" y="270" font-size="16" fill="#14243b" text-anchor="middle" font-weight="400">SAT IN</text><polyline points="635,267 752,267" fill="none" stroke="#1263c6" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><text x="690" y="335" font-size="17" fill="#127246" text-anchor="middle" font-weight="400">Steuerung ←</text><text x="30" y="486" font-size="17" fill="#14243b" text-anchor="start" font-weight="400">Motor: LNB und REC nicht vertauschen. Strombedarf von Motor und LNB gemeinsam beachten.</text><text x="30" y="510" font-size="17" fill="#14243b" text-anchor="start" font-weight="400">USALS verwendet deinen Standort. Befehle bewegen die gesamte Antenne tatsächlich.</text><text x="30" y="560" font-size="14" fill="#69778a" text-anchor="start" font-weight="400">Blau: HF-Koaxialkabel · Violett: HDMI · Gestrichelt: inaktiv</text></g></svg>
