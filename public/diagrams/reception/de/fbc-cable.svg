<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 720" role="img" aria-labelledby="title desc"><title id="title">DVB-C FBC: ein Anschluss, acht Demodulatoren</title><desc id="desc">Kabel-TV an IN, acht QAM-Multiplexe intern; OUT ist nur Durchschleifen.</desc><rect width="980" height="720" rx="16" fill="#f3f7fc"/><g font-family="Arial, Helvetica, sans-serif"><text x="30" y="32" font-size="14" fill="#1263c6" font-weight="700" text-anchor="start">OpenATV | FBC</text><text x="30" y="72" font-size="26" fill="#14243b" font-weight="700" text-anchor="start">DVB-C FBC: ein Anschluss, acht Demodulatoren</text><rect x="30" y="171" width="260" height="100" rx="12" fill="white" stroke="#1263c6" stroke-width="2"/><text x="160.0" y="201" font-size="20" fill="#14243b" font-weight="700" text-anchor="middle">Kabel-TV-Dose</text><text x="160.0" y="228" font-size="16" fill="#14243b" font-weight="400" text-anchor="middle">TV / CATV</text><polyline points="290,221 410,221" stroke="#1263c6" stroke-width="5" stroke-linejoin="round" fill="none"/><rect x="410" y="135" width="530" height="415" rx="12" fill="white" stroke="#1263c6" stroke-width="2"/><text x="675.0" y="165" font-size="20" fill="#14243b" font-weight="700" text-anchor="middle">OpenATV FBC DVB-C</text><rect x="428" y="186" width="190" height="82" rx="12" fill="white" stroke="#1263c6" stroke-width="2"/><text x="523.0" y="216" font-size="20" fill="#14243b" font-weight="700" text-anchor="middle">CABLE / ANT IN</text><text x="523.0" y="243" font-size="16" fill="#14243b" font-weight="400" text-anchor="middle">ein Koaxialkabel</text><rect x="428" y="315" width="190" height="82" rx="12" fill="white" stroke="#69778a" stroke-width="2"/><text x="523.0" y="345" font-size="20" fill="#14243b" font-weight="700" text-anchor="middle">LOOP OUT *</text><text x="523.0" y="372" font-size="16" fill="#14243b" font-weight="400" text-anchor="middle">optional zum TV</text><rect x="684" y="184" width="106" height="56" rx="8" fill="#fff" stroke="#1263c6" stroke-width="2"/><text x="737" y="207" font-size="20" fill="#1263c6" font-weight="700" text-anchor="middle">1</text><text x="737" y="228" font-size="14" fill="#14243b" font-weight="400" text-anchor="middle">QAM</text><rect x="800" y="184" width="106" height="56" rx="8" fill="#fff" stroke="#1263c6" stroke-width="2"/><text x="853" y="207" font-size="20" fill="#1263c6" font-weight="700" text-anchor="middle">2</text><text x="853" y="228" font-size="14" fill="#14243b" font-weight="400" text-anchor="middle">QAM</text><rect x="684" y="252" width="106" height="56" rx="8" fill="#fff" stroke="#1263c6" stroke-width="2"/><text x="737" y="275" font-size="20" fill="#1263c6" font-weight="700" text-anchor="middle">3</text><text x="737" y="296" font-size="14" fill="#14243b" font-weight="400" text-anchor="middle">QAM</text><rect x="800" y="252" width="106" height="56" rx="8" fill="#fff" stroke="#1263c6" stroke-width="2"/><text x="853" y="275" font-size="20" fill="#1263c6" font-weight="700" text-anchor="middle">4</text><text x="853" y="296" font-size="14" fill="#14243b" font-weight="400" text-anchor="middle">QAM</text><rect x="684" y="320" width="106" height="56" rx="8" fill="#fff" stroke="#1263c6" stroke-width="2"/><text x="737" y="343" font-size="20" fill="#1263c6" font-weight="700" text-anchor="middle">5</text><text x="737" y="364" font-size="14" fill="#14243b" font-weight="400" text-anchor="middle">QAM</text><rect x="800" y="320" width="106" height="56" rx="8" fill="#fff" stroke="#1263c6" stroke-width="2"/><text x="853" y="343" font-size="20" fill="#1263c6" font-weight="700" text-anchor="middle">6</text><text x="853" y="364" font-size="14" fill="#14243b" font-weight="400" text-anchor="middle">QAM</text><rect x="684" y="388" width="106" height="56" rx="8" fill="#fff" stroke="#1263c6" stroke-width="2"/><text x="737" y="411" font-size="20" fill="#1263c6" font-weight="700" text-anchor="middle">7</text><text x="737" y="432" font-size="14" fill="#14243b" font-weight="400" text-anchor="middle">QAM</text><rect x="800" y="388" width="106" height="56" rx="8" fill="#fff" stroke="#1263c6" stroke-width="2"/><text x="853" y="411" font-size="20" fill="#1263c6" font-weight="700" text-anchor="middle">8</text><text x="853" y="432" font-size="14" fill="#14243b" font-weight="400" text-anchor="middle">QAM</text><text x="677" y="493" font-size="19" fill="#14243b" font-weight="700" text-anchor="middle">Eine gemeinsame Konfiguration</text><text x="30" y="600" font-size="17" fill="#14243b" font-weight="400" text-anchor="start">Den ersten Tuner des Kabelblocks konfigurieren. Die weiteren Demodulatoren übernehmen dies.</text><text x="30" y="628" font-size="17" fill="#14243b" font-weight="400" text-anchor="start">Keine SCR-Nummern und keine SAT-Ebenen. Ein Suchlauf genügt für die gemeinsame Senderliste.</text><text x="30" y="656" font-size="17" fill="#14243b" font-weight="400" text-anchor="start">* Falls vorhanden: OUT schleift HF durch, liefert keinen weiteren Empfangsweg für diese Box.</text><text x="30" y="697" font-size="14" fill="#69778a" font-weight="400" text-anchor="start">HF / RF: Blau = Koax · Grün/Orange = zweite Zuführung · Innen: schematische Signalwege</text></g></svg>
