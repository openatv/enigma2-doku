hor="middle" font-weight="700">OpenATV</text><text x="708.0" y="325" font-size="16" fill="#14243b" text-anchor="middle" font-weight="400">SAT IN · F</text><polyline points="224,348 338,348" fill="none" stroke="#1263c6" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><text x="278" y="332" font-size="17" fill="#1263c6" text-anchor="middle" font-weight="400">Koax</text><polyline points="528,318 613,318" fill="none" stroke="#1263c6" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><text x="570" y="302" font-size="17" fill="#1263c6" text-anchor="middle" font-weight="400">Koax</text><rect x="813" y="140" width="130" height="96" rx="12" fill="#fff" stroke="#7c3ac2" stroke-width="2"/><text x="878.0" y="169" font-size="20" fill="#14243b" text-anchor="middle" font-weight="700">TV</text><text x="878.0" y="195" font-size="16" fill="#14243b" text-anchor="middle" font-weight="400">HDMI IN</text><polyline points="708,270 708,188 813,188" fill="none" stroke="#7c3ac2" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><text x="685" y="170" font-size="17" fill="#7c3ac2" text-anchor="middle" font-weight="400">HDMI OUT → IN</text><text x="30" y="486" font-size="17" fill="#14243b" text-anchor="start" font-weight="400">Box: Einfach → Einzeln → Astra 19.2°E. Beispiel für einen konventionellen Anschluss.</text><text x="30" y="510" font-size="17" fill="#14243b" text-anchor="start" font-weight="400">Der TV-Anschluss der Dose ersetzt keinen SAT-Anschluss. LAN ist ein separates Netzwerkkabel.</text><text x="30" y="560" font-size="14" fill="#69778a" text-anchor="start" font-weight="400">Blau: HF-Koaxialkabel · Violett: HDMI · Gestrichelt: inaktiv</text></g></svg>
